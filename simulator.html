<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>questie glasses preview</title>
<link href="https://fonts.googleapis.com/css2?family=Tiny5&display=swap" rel="stylesheet">
<style>
  :root { --pink: #ffa8cf; --hot: #ff7eb8; --lilac: #c9b3ff; --ink: #f4eef1; --dim: #8d8790; --panel: #161518; --line: #2a282d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0f0e11; color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 18px 16px 28px; }

  /* ---------- the product shot ---------- */
  .stage { position: relative; inline-size: min(100%, 760px); aspect-ratio: 1; overflow: hidden; border-radius: 14px; }
  .bg { position: absolute; inset: 0; background: center / cover no-repeat; }
  .bg canvas { inline-size: 100%; block-size: 100%; object-fit: cover; image-rendering: pixelated; display: block; }
  .bg canvas[hidden] { display: none; }
  .headline { position: absolute; inset: 5% 0 auto; text-align: center; pointer-events: none; }
  .headline b { display: block; font: 400 clamp(28px, 7vw, 56px) "Tiny5", monospace; color: var(--pink); letter-spacing: 2px; line-height: 1; }
  .headline span { font: 400 clamp(12px, 2.4vw, 18px) "Tiny5", monospace; color: rgba(255,255,255,.75); letter-spacing: 1px; }
  .light .headline span { color: rgba(40,30,45,.7); }
  /* The display is additive: black adds no light (see-through), colours glow on top of whatever is behind. */
  .hud { position: absolute; left: var(--hx); top: var(--hy); inline-size: 600px; block-size: 600px;
         transform: translate(-50%, -50%) scale(var(--hs, .5)); transform-origin: center;
         mix-blend-mode: screen; opacity: var(--b, .95); }
  .hud iframe { inline-size: 100%; block-size: 100%; border: 0; background: #000; display: block; }
  .bounds .hud { outline: 3px dashed rgba(255,255,255,.5); }
  #glasses { position: absolute; inset: 0; inline-size: 100%; block-size: 100%; image-rendering: pixelated; pointer-events: none; }
  .note { position: absolute; left: 50%; bottom: 5%; transform: translateX(-50%); margin: 0; padding: 6px 12px;
          background: rgba(20,12,30,.85); border-radius: 6px; font: 400 13px "Tiny5", monospace; }

  /* ---------- controls ---------- */
  .panel { inline-size: min(100%, 760px); display: grid; grid-template-columns: auto 1fr; gap: 16px 22px;
           background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .panel h2 { font: 400 12px "Tiny5", monospace; letter-spacing: 1px; color: var(--dim); margin: 0 0 8px; }
  .pad { display: grid; grid-template-columns: repeat(3, 36px) 14px 44px 44px; grid-template-rows: repeat(3, 36px); gap: 4px; align-items: center; }
  .pad button { background: #2a2530; color: var(--ink); border: 0; border-radius: 6px; font: inherit; cursor: pointer; block-size: 36px; }
  .pad button:hover { outline: 2px solid var(--pink); }
  .pad .a, .pad .b { inline-size: 44px; block-size: 44px; border-radius: 50%; font: 400 18px "Tiny5", monospace; color: #2a0d1b; }
  .pad .a { background: var(--hot); grid-column: 6; grid-row: 1 / 3; }
  .pad .b { background: var(--lilac); grid-column: 5; grid-row: 2 / 4; }
  .backs { display: flex; flex-wrap: wrap; gap: 6px; }
  .back { inline-size: 64px; block-size: 44px; border-radius: 6px; border: 2px solid transparent; background: center / cover; cursor: pointer; position: relative; padding: 0; overflow: hidden; }
  .back[aria-pressed="true"] { border-color: var(--pink); }
  .back span { position: absolute; inset: auto 0 0 0; font: 400 10px "Tiny5", monospace; background: rgba(0,0,0,.55); color: #fff; padding: 1px 3px; text-align: left; }
  .upload { display: grid; place-items: center; background: #222025; border: 1px dashed #4a464e; color: var(--dim); font: 400 10px "Tiny5", monospace; }
  .row { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; color: var(--dim); font-size: 12px; }
  .row label { display: flex; align-items: center; gap: 8px; }
  input[type=range] { accent-color: var(--pink); }
  kbd { font: 11px ui-monospace, monospace; background: #222025; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
  @media (max-width: 640px) { .panel { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<main class="stage" id="stage" aria-label="Pixel-art glasses with questie showing through the right lens">
  <div class="bg" id="bg"><canvas id="street" width="320" height="180" hidden></canvas></div>
  <div class="headline"><b>questie</b><span>side quests for your glasses</span></div>
  <div class="hud"><iframe id="app" src="index.html" title="questie running on the glasses display"></iframe></div>
  <canvas id="glasses" width="144" height="144"></canvas>
  <p class="note" id="note" hidden>back on the home screen exits the app</p>
</main>

<section class="panel">
  <div>
    <h2>controls</h2>
    <div class="pad">
      <span></span><button data-key="ArrowUp" aria-label="Swipe up">▲</button><span></span><span></span>
      <span></span><button class="a" data-key="Enter" aria-label="Tap">A</button>
      <button data-key="ArrowLeft" aria-label="Swipe left">◀</button><span></span><button data-key="ArrowRight" aria-label="Swipe right">▶</button><span></span>
      <button class="b" data-back aria-label="Back">B</button>
      <span></span><button data-key="ArrowDown" aria-label="Swipe down">▼</button><span></span>
    </div>
  </div>
  <div>
    <h2>background</h2>
    <div class="backs" id="backs"></div>
  </div>
  <div class="row">
    <label>size <input id="size" type="range" min="60" max="100" value="92"></label>
    <label>brightness <input id="bright" type="range" min="40" max="100" value="95"></label>
    <label><input type="checkbox" id="bounds"> display edge</label>
    <span>A = tap · B = back · or <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> <kbd>Enter</kbd> <kbd>Esc</kbd></span>
  </div>
</section>

<script>
const stage = document.getElementById("stage"), frame = document.getElementById("app");
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem("questieSim2." + k)) ?? d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem("questieSim2." + k, JSON.stringify(v)); } catch {} } };
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- pixel-art glasses, seen from behind (144×144 grid) ----------
// Browline style like the reference: thick black acetate across the top, fading to a thin
// silver rim along the bottom. The right lens is the one with the display.
const G = 144;
const LENS = { x: 36, y: 44, w: 76, h: 62 };            // main (display) lens
const LEFT = { x: -46, y: 46, w: 62, h: 58 };           // partly off-frame on the left
const inRound = (x, y, r, grow, rad) => {
  const x0 = r.x - grow, y0 = r.y - grow, x1 = r.x + r.w + grow, y1 = r.y + r.h + grow;
  if (x < x0 || x >= x1 || y < y0 || y >= y1) return false;
  const R = rad + grow, cx = Math.min(Math.max(x, x0 + R), x1 - R - 1), cy = Math.min(Math.max(y, y0 + R), y1 - R - 1);
  return (x - cx) ** 2 + (y - cy) ** 2 <= R * R;
};
function drawGlasses(shadow) {
  const g = document.getElementById("glasses").getContext("2d"), img = g.createImageData(G, G), d = img.data;
  const put = (x, y, c, a = 255) => { if (x < 0 || y < 0 || x >= G || y >= G) return; const i = (y * G + x) * 4;
    d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = a; };
  const BLACK = [20, 19, 24], SHINE = [78, 74, 88], SILVER_DK = [138, 137, 148], SILVER = [205, 205, 214], ARM = [62, 60, 70], ARM_HI = [96, 93, 106];
  const PINK = [255, 168, 207], PINK_DK = [255, 126, 184];
  // soft floor shadow under the frame (studio backgrounds only)
  if (shadow) for (let y = 108; y < 124; y++) for (let x = 0; x < G; x++) {
    const e = ((x - 70) / 74) ** 2 + ((y - 115) / 7) ** 2; if (e < 1 && (x + y) % 2 === 0) put(x, y, [0, 0, 0], Math.round(70 * (1 - e)));
  }
  // temple arm: from the hinge block sweeping down to the bottom-right corner, widening toward us
  const ax0 = 118, ay0 = 56, ax1 = 150, ay1 = 132;
  for (let y = 40; y < G; y++) for (let x = 100; x < G; x++) {
    const vx = ax1 - ax0, vy = ay1 - ay0, t = Math.max(0, Math.min(1, ((x - ax0) * vx + (y - ay0) * vy) / (vx * vx + vy * vy)));
    const dist = Math.hypot(x - ax0 - t * vx, y - ay0 - t * vy), half = 3 + t * 4.5;
    if (dist <= half) put(x, y, dist > half - 1.5 && (x - ax0) * vy - (y - ay0) * vx < 0 ? ARM_HI : ARM);
  }
  // hinge block with the display module, and a tiny pink heart on it
  for (let y = 46; y < 66; y++) for (let x = 110; x < 124; x++) put(x, y, y < 49 ? ARM_HI : x > 121 ? [30, 29, 35] : ARM);
  ["#.#", "###", ".#."].forEach((r, j) => [...r].forEach((c, i) => c === "#" && put(115 + i, 54 + j, PINK)));
  // rims: thick black top half, thin dithered silver bottom half
  const rim = (L, rad) => {
    const mid = L.y + L.h * .48;
    for (let y = L.y - 6; y < L.y + L.h + 4; y++) for (let x = L.x - 6; x < L.x + L.w + 6; x++) {
      if (inRound(x, y, L, 0, rad)) continue;
      const top = y < mid, t = top ? 5 : 2;
      if (!inRound(x, y, L, t, rad)) continue;
      if (top) put(x, y, !inRound(x, y - 1, L, t, rad) ? SHINE : BLACK);
      else { const k = (y - mid) / (L.h * .55); put(x, y, (x + y) % 2 === 0 && k < .5 ? SILVER_DK : k < .25 ? SILVER_DK : SILVER); }
    }
  };
  rim(LEFT, 12); rim(LENS, 12);
  // bridge: a thick black arch joining the two lenses
  for (let x = LEFT.x + LEFT.w; x < LENS.x; x++) {
    const arch = Math.round(2 * Math.sin(Math.PI * (x - (LEFT.x + LEFT.w)) / (LENS.x - LEFT.x - LEFT.w)));
    for (let y = 39 - arch; y < 46 - arch; y++) put(x, y, y === 39 - arch ? SHINE : BLACK);
  }
  // nose pads (pink, for cuteness) on little silver arms
  const PAD = [".##.", "####", "####", "####", "####", ".##."];
  for (const [px, dir] of [[LENS.x + 4, 1], [LEFT.x + LEFT.w - 8, -1]]) {
    for (let i = 0; i < 4; i++) put(px + (dir > 0 ? -i : 3 + i), 52 + i, SILVER_DK);        // arm from rim to pad
    PAD.forEach((r, j) => [...r].forEach((c, i) => c === "#" && put(px + i, 56 + j, i === (dir > 0 ? 1 : 2) ? PINK : PINK_DK)));
  }
  // two little glare streaks on the main lens
  for (let i = 0; i < 9; i++) { put(LENS.x + 6 + i, LENS.y + 12 - i, [255, 255, 255], 70); put(LENS.x + 10 + i, LENS.y + 13 - i, [255, 255, 255], 45); }
  g.putImageData(img, 0, 0);
}

// ---------- pixel street (reused from the earlier version, dusk and night) ----------
const W = 320, H = 180, GROUND = 140;
const TIMES = {
  dusk:  { sky: ["#2c1f54", "#4b2a6e", "#7d3b7d", "#c25b80", "#f39a87"], orb: "#ffd1a1", far: "#3b2b63",
           bldg: ["#6d4b7d", "#86506f", "#5b4a85", "#7a5a6e"], trim: "#2a1c3c", on: "#ffcf7a", off: "#3a2a52",
           walk: "#58486b", walkLine: "#4a3b5c", street: "#2b2237", lane: "#8a7aa0", tree: "#2f6b62", treeHi: "#3f8a74", trunk: "#3a2a3a", lamp: "#ffd890", stars: false },
  night: { sky: ["#0b0920", "#120f30", "#19143d", "#211a4a", "#2a2056"], orb: "#fff3d6", far: "#1c1638",
           bldg: ["#2f2650", "#3a2a55", "#2a2a4f", "#352743"], trim: "#140f26", on: "#ffd27f", off: "#221a3a",
           walk: "#2e2640", walkLine: "#251f36", street: "#15111f", lane: "#5b5070", tree: "#1d3f3c", treeHi: "#275249", trunk: "#211a26", lamp: "#ffe2a0", stars: true },
};
const street = document.getElementById("street"), sx = street.getContext("2d");
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const BUILDINGS = []; let streetLen = 0;
for (let i = 0; i < 18; i++) { const w = 34 + Math.floor(hash(i) * 20), h = 58 + Math.floor(hash(i + 50) * 46);
  BUILDINGS.push({ x: streetLen, w, h, c: i % 4, shop: hash(i + 9) < .35, seed: i }); streetLen += w + 2; }
const px = (x, y, w, h, c) => { sx.fillStyle = c; sx.fillRect(Math.round(x), Math.round(y), w, h); };
const wrap = (x, len) => ((x % len) + len) % len;
function drawStreet(P, t) {
  const band = GROUND / P.sky.length;
  P.sky.forEach((c, i) => px(0, i * band, W, band + 1, c));
  for (let i = 1; i < P.sky.length; i++) for (let x = 0; x < W; x += 2) px(x + (i % 2), Math.round(i * band) - 1, 1, 1, P.sky[i]);
  if (P.stars) for (let i = 0; i < 40; i++) if ((t >> 3) % 7 !== i % 7) px(hash(i) * W, hash(i + 3) * 70, 1, 1, "#fff4fa");
  for (let y = -7; y <= 7; y++) for (let x = -7; x <= 7; x++) if (x * x + y * y <= 49) px(252 + x, 30 + y, 1, 1, P.orb);
  const farOff = wrap(t * .15, 160);
  for (let k = -1; k < 3; k++) for (let i = 0; i < 10; i++) { const bh = 22 + hash(i + 200) * 34; px(k * 160 + i * 16 - farOff, GROUND - 20 - bh, 15, bh + 20, P.far); }
  const bOff = wrap(t * .5, streetLen);
  for (const b of BUILDINGS) for (const rep of [0, streetLen]) {
    const x = b.x + rep - bOff; if (x > W || x + b.w < 0) continue;
    const top = GROUND - b.h;
    px(x, top, b.w, b.h, P.bldg[b.c]); px(x - 1, top - 2, b.w + 2, 3, P.trim);
    for (let wy = top + 7; wy < GROUND - 18; wy += 11) for (let wx = x + 5; wx < x + b.w - 6; wx += 9) {
      const lit = hash(b.seed * 31 + wx * .7 + wy) < (P.stars ? .6 : .45);
      px(wx, wy, 5, 6, lit ? P.on : P.off); px(wx, wy + 6, 5, 1, P.trim);
    }
    const doorX = x + Math.floor(b.w / 2) - 3; px(doorX, GROUND - 11, 7, 11, P.trim);
    if (b.shop) for (let ax = 0; ax < b.w - 4; ax++) px(x + 2 + ax, GROUND - 17, 1, 4, ax % 4 < 2 ? "#ff9fc8" : "#fff4fa");
    else px(doorX - 2, GROUND - 2, 11, 2, P.trim);
  }
  px(0, GROUND, W, 10, P.walk);
  for (let x = -wrap(t, 8); x < W; x += 8) px(x, GROUND, 1, 10, P.walkLine);
  px(0, GROUND + 10, W, 2, P.walkLine); px(0, GROUND + 12, W, H - GROUND - 12, P.street);
  for (let x = -wrap(t * 1.4, 24); x < W; x += 24) px(x, GROUND + 25, 12, 2, P.lane);
  const tOff = wrap(t, 90);
  for (let x = -tOff; x < W + 90; x += 90) {
    px(x + 4, GROUND - 12, 2, 13, P.trunk);
    for (let y = -9; y <= 9; y++) for (let dx = -10; dx <= 10; dx++) if (dx * dx * .8 + y * y <= 81) px(x + 5 + dx, GROUND - 22 + y, 1, 1, (dx + y) % 5 === 0 ? P.treeHi : P.tree);
    px(x + 50, GROUND - 30, 1, 30, P.trim); px(x + 49, GROUND - 32, 3, 2, P.lamp);
  }
}

// ---------- backgrounds ----------
// studio: flat product-shot greys (mid grey by default; on a pale backdrop the additive display
// genuinely washes out, just like on the real glasses in bright light)
const BACKS = [
  { name: "studio", css: "radial-gradient(ellipse at 50% 35%, #9b98a3, #6a6773 70%, #55525d)", studio: true },
  { name: "studio dark", css: "radial-gradient(ellipse at 50% 35%, #3a3740, #1d1b21 70%, #141217)", studio: true },
  { name: "studio light", css: "radial-gradient(ellipse at 50% 35%, #f1f0f2, #dcdadf 70%, #cfcdd3)", studio: true, light: true },
  { name: "street dusk", street: "dusk" }, { name: "street night", street: "night" },
  { name: "park", photo: 17 }, { name: "city", photo: 57 }, { name: "forest", photo: 28 }, { name: "lake", photo: 128 },
];
const bg = document.getElementById("bg"), backsEl = document.getElementById("backs");
let current = null, tick = 0;
function applyBack(b, url) {
  current = b;
  street.hidden = !b.street;
  bg.style.background = b.css || (url ? `center / cover no-repeat url("${url}")` : b.photo ? `center / cover no-repeat url(https://picsum.photos/id/${b.photo}/1200/1200)` : "#000");
  stage.classList.toggle("light", !!b.light);
  if (b.street) drawStreet(TIMES[b.street], tick);
  drawGlasses(!!b.studio);
}
function pick(i) {
  backsEl.querySelectorAll(".back").forEach((el, j) => el.setAttribute("aria-pressed", String(j === i)));
  applyBack(BACKS[i]); store.set("back", i);
}
BACKS.forEach((b, i) => {
  const el = document.createElement("button");
  el.className = "back"; el.type = "button"; el.innerHTML = `<span>${b.name}</span>`;
  el.style.background = b.css || (b.street ? (b.street === "dusk" ? "linear-gradient(#4b2a6e, #c25b80 60%, #58486b 61%)" : "linear-gradient(#0b0920, #2a2056 60%, #2e2640 61%)")
                                   : `center / cover url(https://picsum.photos/id/${b.photo}/140/100)`);
  el.onclick = () => pick(i); backsEl.append(el);
});
// Your own photo stays on this computer: it's read locally, never uploaded.
const up = document.createElement("label");
up.className = "back upload"; up.innerHTML = `your photo<input type="file" accept="image/*" hidden>`;
up.querySelector("input").onchange = e => { const f = e.target.files[0]; if (!f) return;
  backsEl.querySelectorAll(".back").forEach(el => el.setAttribute("aria-pressed", "false")); up.setAttribute("aria-pressed", "true");
  applyBack({ name: "photo" }, URL.createObjectURL(f)); };
backsEl.append(up);
pick(Math.min(store.get("back", 0), BACKS.length - 1));
// the street gently scrolls, as if you're walking
setInterval(() => { if (current?.street && !reduceMotion && !document.hidden) { tick++; drawStreet(TIMES[current.street], tick); } }, 1000 / 12);

// ---------- place the app in the main lens ----------
const sizeEl = document.getElementById("size"), brightEl = document.getElementById("bright"), boundsEl = document.getElementById("bounds");
function placeHud() {
  const k = stage.clientWidth / G;
  stage.style.setProperty("--hx", ((LENS.x + LENS.w / 2) / G * 100) + "%");
  stage.style.setProperty("--hy", ((LENS.y + LENS.h / 2) / G * 100) + "%");
  stage.style.setProperty("--hs", (LENS.h * k / 600) * (sizeEl.value / 100));
  stage.style.setProperty("--b", brightEl.value / 100);
}
[sizeEl, brightEl].forEach(el => { el.value = store.get(el.id, el.value); el.oninput = () => { store.set(el.id, el.value); placeHud(); }; });
boundsEl.checked = store.get("bounds", false); stage.classList.toggle("bounds", boundsEl.checked);
boundsEl.onchange = () => { stage.classList.toggle("bounds", boundsEl.checked); store.set("bounds", boundsEl.checked); };
new ResizeObserver(placeHud).observe(stage);

// ---------- input: same events the glasses produce (arrow keys, Enter, history Back) ----------
function press(key) {
  const win = frame.contentWindow, doc = win.document;
  const target = doc.activeElement && doc.activeElement !== doc.body ? doc.activeElement : doc.body;
  const ev = new win.KeyboardEvent("keydown", { key, bubbles: true, cancelable: true });
  target.dispatchEvent(ev);
  // A synthetic Enter doesn't press buttons by itself, so activate the selected control.
  if (key === "Enter" && !ev.defaultPrevented) {
    const el = doc.activeElement && doc.activeElement !== doc.body ? doc.activeElement : doc.querySelector("[data-sel]");
    if (el?.tagName === "INPUT") el.focus(); else el?.click();
  }
}
// The app's history is shared with this page, so going back past the app's home screen would
// navigate the simulator itself away. On the glasses that Back exits the app, so just say so.
const note = document.getElementById("note");
function back() {
  const depth = frame.contentWindow.history.state?.d || 0;
  if (depth > 0) return frame.contentWindow.history.back();
  note.hidden = false; clearTimeout(back.t); back.t = setTimeout(() => (note.hidden = true), 1800);
}
document.querySelectorAll("[data-key]").forEach(b => b.onclick = () => press(b.dataset.key));
document.querySelector("[data-back]").onclick = back;
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" && e.target.type !== "checkbox") return;
  if (e.key.startsWith("Arrow") || e.key === "Enter") { e.preventDefault(); press(e.key); }
  else if (e.key === "Escape" || e.key === "Backspace") { e.preventDefault(); back(); }
});
</script>
</body>
</html>
