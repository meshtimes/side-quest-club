<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="application-name" content="questie">
<meta name="description" content="questie turns daily errands into tiny RPG side quests. Earn XP, level up, become a Functioning Adult.">
<meta name="mrbd-web-app-capable" content="yes">
<title>questie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tiny5&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ffa8cf;
    --pink-hot: #ff7eb8;
    --ink: #fff4fa;
    --dim: #c9b6c0;
    --line: rgba(255, 244, 250, 0.75);
  }
  html, body, #app { inline-size: 100%; block-size: 100%; margin: 0; }
  /* Black = unlit on the additive display, so it reads as see-through. */
  body {
    background: #000;
    color: var(--ink);
    font-family: "Tiny5", monospace;   /* pixel font everywhere; sizes are multiples of 8 so glyph pixels stay even */
    overflow: hidden;
  }
  #app { display: grid; place-items: center; }
  .screen {
    inline-size: min(100%, 600px);
    block-size: min(100%, 600px);
    box-sizing: border-box;
    padding: 40px 44px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px;
    position: relative;
    text-align: center;
    animation: pop .28s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }

  h1 { font-weight: 400; font-size: 40px; margin: 0; letter-spacing: .5px; }
  h1.underline { text-decoration: underline; text-decoration-color: var(--pink); text-underline-offset: 8px; text-decoration-thickness: 3px; }
  .big { font-size: 32px; line-height: 1.15; margin: 0; }
  .sub { font-size: 24px; color: var(--dim); margin: 0; }
  .xp { color: var(--pink); font-size: 32px; }

  button {
    font: inherit; color: inherit; background: none; border: 0; cursor: pointer;
  }
  .pill {
    background: var(--pink); color: #2a0d1b;
    font-size: 24px; padding: 10px 30px; border-radius: 0;
  }
  .pill.ghost { background: none; color: var(--ink); border: 2px solid var(--line); font-size: 24px; padding: 8px 24px; }
  /* Docs: keep a visible focus ring; browser focus is the source of truth. */
  :where(button, a, input):focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
  .pill:focus-visible { outline-color: var(--ink); }

  .box { border: 2px solid var(--line); border-radius: 0; padding: 14px 18px; }

  /* quest list */
  .list { display: flex; flex-direction: column; gap: 10px; inline-size: 100%; max-block-size: 380px; overflow-y: auto; padding: 6px; box-sizing: border-box; }
  .row {
    display: grid; grid-template-columns: 30px 52px 1fr auto; align-items: center; gap: 12px;
    text-align: left; font-size: 24px; line-height: 1.1;
    border: 2px solid var(--line); border-radius: 0; padding: 8px 14px;
  }
  /* fit six quests on the 600×600 screen: shorter rows, icons capped to one height */
  .screen[data-screen=list] { padding-block: 20px; gap: 12px; }
  .screen[data-screen=list] .list { max-block-size: 444px; gap: 8px; }
  .row { padding-block: 5px; min-block-size: 56px; box-sizing: border-box; }
  .row .sprite { max-block-size: 40px; inline-size: auto; }
  /* quest names use VT323: taller letters read better than Tiny5 at list size; XP stays Tiny5 */
  .row .name { font-family: "VT323", monospace; font-size: 30px; line-height: 1; }
  .row.done { opacity: .5; }
  .row.done .name { text-decoration: line-through; }
  .row .xpv { color: var(--pink); white-space: nowrap; }
  .check { inline-size: 24px; block-size: 24px; border: 2px solid var(--ink); border-radius: 0; display: grid; place-items: center; font-size: 16px; }
  .row.done .check { background: var(--pink); border-color: var(--pink); color: #2a0d1b; }
  .row:focus-visible { outline-offset: 2px; }

  .bar { inline-size: 100%; max-inline-size: 420px; block-size: 26px; border: 2px solid var(--ink); border-radius: 0; overflow: hidden; position: relative; }
  .bar > i { position: absolute; inset: 0 auto 0 0; background: var(--pink); border-radius: 0; transition: width .9s cubic-bezier(.2,.8,.2,1); }
  .barlabels { inline-size: 100%; max-inline-size: 420px; display: flex; justify-content: space-between; font-size: 24px; }

  .sprite { image-rendering: pixelated; shape-rendering: crispEdges; }
  .row-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }

  input[type=text] {
    font: inherit; font-size: 24px; color: var(--ink); background: none;
    border: 2px solid var(--line); border-radius: 0; padding: 10px 16px; inline-size: 100%; max-inline-size: 440px; box-sizing: border-box;
  }
  input::placeholder { color: var(--dim); }

  /* sparkles */
  .spark { position: absolute; color: var(--ink); font-size: 30px; animation: twinkle 1.6s ease-in-out infinite; pointer-events: none; }
  /* pixel flowers blink in steps instead of rotating, so they stay crisp */
  @keyframes twinkle { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  .spark { animation-timing-function: steps(3, jump-none); }
  .pxflower { display: block; inline-size: 1em; block-size: 1em; }
  .burst { position: absolute; left: 50%; top: 50%; font-size: 26px; color: var(--pink); pointer-events: none; animation: burst 1s ease-out forwards; }
  @keyframes burst { from { transform: translate(-50%,-50%) scale(.4); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1); opacity: 0; } }
  .bounce { animation: bounce 1.4s ease-in-out infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* home: pink paper card with the folk pattern cut out (holes = see-through) */
  .screen[data-screen=home] { font-family: "Tiny5", monospace; gap: 12px; padding: 18px 30px; }
  .logo { font-family: "Tiny5", monospace; font-size: 64px; line-height: 1; color: var(--pink); margin: 0; letter-spacing: 2px; }
  .card { inline-size: 100%; max-inline-size: 540px; }
  .card svg { display: block; inline-size: 100%; block-size: auto; }
  .card .tw { animation: twinkle-hole 2.4s steps(2) infinite; }
  @keyframes twinkle-hole { 50% { opacity: .35; } }
  .stats { display: flex; align-items: center; gap: 14px; inline-size: 100%; max-inline-size: 520px; font-size: 22px; color: var(--pink); }
  .stats .bar { block-size: 14px; border-color: var(--pink); border-radius: 0; flex: 1; }
  .stats .bar > i { border-radius: 0; }
  .pill.pixel { font-family: "Tiny5", monospace; font-size: 24px; border-radius: 0; padding: 8px 28px; }

  .folkframe { position: absolute; inset: 0; inline-size: 100%; block-size: 100%; pointer-events: none; }
  .done-icon .sprite { display: block; max-block-size: 48px; inline-size: auto; }
  .stamp { padding: 10px 14px; border-radius: 0; outline: 4px dashed var(--pink); outline-offset: 4px; }
  .stamp .hopbun { display: block; }
  .tag { font-size: 16px; color: var(--dim); }

  /* Desktop-only frame so the 600×600 glasses view is obvious outside the glasses. */
  @media (min-width: 720px) and (min-height: 720px) {
    body { background: radial-gradient(circle at 50% 40%, #2b2a30, #0d0c10 70%); }
    .screen { background: #000; border-radius: 48px; box-shadow: 0 0 0 2px #333; }
  }
</style>

// No dark colours: the additive display can't show them (dark ≈ see-through).
const COLORS = { P: "#ffa8cf", H: "#ff7eb8", W: "#fff4fa", D: "#ff3d97" };
function sprite(name, px = 5) {
  const rows = SPRITES[name] || SPRITES.star;
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  px *= Math.min(1, 12 / w);
  let rects = "";
  rows.forEach((r, y) => [...r].forEach((c, x) => {
    if (COLORS[c]) rects += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${COLORS[c]}"/>`;
  }));
  return `<svg class="sprite" aria-hidden="true" width="${w * px}" height="${h * px}" viewBox="0 0 ${w} ${h}">${rects}</svg>`;
}

// ---------- errand → quest translator ----------
const QUEST_BOOK = [
  { re: /grocer|food|market|trader|whole ?foods/i, name: "Acquire survival supplies", xp: 30, icon: "basket" },
  { re: /package|parcel|mail ?room|pick ?up|amazon|ups|fedex/i, name: "Retrieve the mysterious parcel", xp: 20, icon: "box" },
  { re: /coffee|latte|matcha|caf|\btea\b/i, name: "Obtain caffeine", xp: 15, icon: "teapot" },
  { re: /laundry|wash clothes|dry ?clean/i, name: "Laundry", xp: 40, icon: "hanger" },
  { re: /water|plant|garden|flower/i, name: "Water plants", xp: 20, icon: "flowers" },
  { re: /e-?mail|inbox|reply|message/i, name: "Inbox zero", xp: 25, icon: "mail" },
  { re: /gym|workout|run|yoga|pilates|walk/i, name: "Train at the warriors' guild", xp: 35, icon: "dumbbell" },
  { re: /dish|clean|tidy|vacuum/i, name: "Do dishes", xp: 25, icon: "cutlery" },
  { re: /design|figma|mockup|portfolio/i, name: "Design work", xp: 35, icon: "laptop" },
  { re: /bill|bank|rent|tax|pay/i, name: "Pay tribute to the crown", xp: 20, icon: "coin" },
];
function toQuest(errand) {
  const hit = QUEST_BOOK.find(q => q.re.test(errand));
  const base = hit || { name: "Embark on: " + errand, xp: 10, icon: "star" };
  return { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), errand, name: base.name, xp: base.xp, icon: base.icon, done: false };
}

// ---------- state (localStorage; writes can fail per Meta docs) ----------
const XP_PER_LEVEL = 100;
const KEY = "sideQuestClub.v1";
const today = () => new Date().toLocaleDateString("en-CA");
const STARTER = ["Do laundry", "Get coffee", "Water plants", "Do dishes", "Inbox zero", "Design work"];
function defaultState() {
  return { day: today(), level: 3, xp: 65, achievements: [], added: ["list2"], quests: STARTER.map(toQuest) };
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (!s) return defaultState();
    s.quests.forEach(q => { q.icon = { cup: "teapot", shirt: "hanger", plate: "cutlery" }[q.icon] || q.icon; });   // renamed icons
    const SHORT_NAMES = { "Defeat the laundry monster": "Laundry", "Obtain caffeine potion": "Obtain caffeine", "Tend the enchanted garden": "Water plants", "Vanquish the dish hydra": "Do dishes", "Confront the inbox demons": "Inbox zero", "Forge the legendary design": "Design work" };
    s.quests.forEach(q => { q.name = SHORT_NAMES[q.name] || q.name; });   // built-in quests got shorter names
    // One-time switch of saved lists to the current starter quests: matching quests keep their
    // progress, the retired ones (groceries, parcel) go, and the wearer's own errands stay at the end.
    s.added = s.added || [];
    if (!s.added.includes("list2")) {
      const used = new Set();
      const starter = STARTER.map(errand => {
        const fresh = toQuest(errand), mine = s.quests.find(q => q.icon === fresh.icon && !used.has(q));
        if (mine) { used.add(mine); return mine; }
        return fresh;
      });
      const retired = ["basket", "box"], starterIcons = starter.map(q => q.icon);
      const own = s.quests.filter(q => !used.has(q) && !retired.includes(q.icon) && !starterIcons.includes(q.icon));
      s.quests = [...starter, ...own];
      s.added.push("list2");
      try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {}
    }
    if (s.day !== today()) { s.day = today(); s.quests.forEach(q => (q.done = false)); }  // new day, fresh quest board
    return s;
  } catch { return defaultState(); }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
let S = load();

// Folk-art border: a fine single-stitch vine with tiny leaves along the top and left,
// mirrored on both axes so the frame is symmetric. Returns a set of "x,y" stitches.
function folkBorder(W, H) {
  const g = new Set(), k = (x, y) => x + "," + y;
  const set = (x, y) => { if (x >= 0 && y >= 0 && x < W && y < H) g.add(k(x, y)); };
  const stamp = (rows, x0, y0) => rows.forEach((r, y) => [...r].forEach((c, x) => c === "#" && set(x0 + x, y0 + y)));
  const wave = t => Math.round(Math.sin((t / 10) * Math.PI * 2));
  const DIAMOND = [".#.", "#.#", ".#."];
  const FLOWER = ["..#..", ".#.#.", "#...#", ".#.#.", "..#.."];
  let prev;
  for (let x = 3; x < W / 2; x++) {
    const y = 2 + wave(x - 3);
    set(x, y); if (prev !== undefined && Math.abs(prev - y) > 1) set(x, (prev + y) >> 1); prev = y;
    const ph = (x - 3) % 10;
    if (ph === 2) { set(x + 1, y - 1); set(x + 2, y - 2); }       // leaf up
    if (ph === 7) { set(x + 1, y + 1); set(x + 2, y + 2); }       // leaf down
  }
  prev = undefined;
  for (let y = 3; y < H / 2; y++) {
    const x = 2 + wave(y - 3);
    set(x, y); if (prev !== undefined && Math.abs(prev - x) > 1) set((prev + x) >> 1, y); prev = x;
    const ph = (y - 3) % 10;
    if (ph === 2) { set(x - 1, y + 1); set(x - 2, y + 2); }
    if (ph === 7) { set(x + 1, y + 1); set(x + 2, y + 2); }
    if (ph === 5 && y < H / 2 - 6) stamp(DIAMOND, 5, y - 1);
  }
  stamp(["#.#", ".#.", "#.#"], 0, 0);
  stamp(FLOWER, W / 2 - 3, 0);
  stamp(FLOWER, 0, H / 2 - 3);
  [...g].forEach(p => { const [x, y] = p.split(",").map(Number); set(W - 1 - x, y); set(x, H - 1 - y); set(W - 1 - x, H - 1 - y); });

  return g;
}

// CSS that flips between bunny frames: one keyframe track per frame, visible only in its SEQ slots.
function bunnyHopCss(prefix, scope) {
  const total = BUNNY_SEQ.reduce((t, [, ms]) => t + ms, 0);
  return Object.keys(BUNNY_FRAMES).map(name => {
    let t = 0, kf = "";
    BUNNY_SEQ.forEach(([n, ms]) => { kf += `${(t / total * 100).toFixed(2)}%{opacity:${n === name ? 1 : 0}}`; t += ms; });
    return `@keyframes ${prefix}-${name}{${kf}100%{opacity:${BUNNY_SEQ[0][0] === name ? 1 : 0}}}
      ${scope} .${prefix}-${name}{opacity:${name === "idle" ? 1 : 0};animation:${prefix}-${name} ${total}ms steps(1,end) infinite}`;
  }).join("");
}
// Stitches for each frame, standing on row `ground` with its left edge at column `bx`.
function bunnyFrameStitches(bx, ground) {
  const out = {};
  Object.entries(BUNNY_FRAMES).forEach(([name, f]) => {
    const s = (out[name] = new Set()), top = ground - f.lift - f.rows.length + 1;
    f.rows.forEach((r, y) => [...r].forEach((c, x) => c === "#" && s.add((bx + x) + "," + (top + y))));
  });
  return out;
}
// Filled pink version of the hopping bunny (the home card cuts the same frames out of paper).
let hopBunny = null;
function getHopBunny() {
  if (hopBunny) return hopBunny;
  const W = 15, H = 16, gap = 0.12, frames = bunnyFrameStitches(0, H - 1);
  const rects = set => [...set].map(p => { const [x, y] = p.split(",").map(Number);
    return `<rect x="${x + gap}" y="${y + gap}" width="${1 - gap * 2}" height="${1 - gap * 2}"/>`; }).join("");
  return (hopBunny = `<svg class="hopbun" viewBox="0 0 ${W} ${H}" width="${W * 8}" height="${H * 8}" shape-rendering="crispEdges" aria-hidden="true" fill="var(--pink)">
    <style>${bunnyHopCss("hb", ".hopbun")}</style>
    ${Object.entries(frames).map(([n, set]) => `<g class="hb-${n}">${rects(set)}</g>`).join("")}</svg>`);
}
// Folk border drawn as filled pink stitches around a whole screen.
let folkFrame = null;
function getFolkFrame() {
  if (folkFrame) return folkFrame;
  const N = 56, gap = 0.14;
  const rects = [...folkBorder(N, N)].map(p => { const [x, y] = p.split(",").map(Number);
    return `<rect x="${x + gap}" y="${y + gap}" width="${1 - gap * 2}" height="${1 - gap * 2}"/>`; }).join("");
  return (folkFrame = `<svg class="folkframe" viewBox="0 0 ${N} ${N}" preserveAspectRatio="none" shape-rendering="crispEdges" aria-hidden="true" fill="var(--pink)">${rects}</svg>`);
}

// ---------- folk-art cutout card ----------
// A W×H stitch grid: every set cell becomes a hole punched through the pink paper.
// Built lazily because the "questie" title is rasterised from the Tiny5 web font.
let folkCard = null;
function getFolkCard() { return folkCard || (folkCard = buildFolkCard()); }
document.fonts?.load('40px "Tiny5"').then(() => {
  folkCard = null;
  if ((history.state || {}).screen === "home") render(history.state);
}).catch(() => {});

function buildFolkCard() {
  const W = 52, H = 44, g = new Set(), tw = new Set();
  const k = (x, y) => x + "," + y;
  const set = (x, y, into = g) => { if (x >= 0 && y >= 0 && x < W && y < H) into.add(k(x, y)); };
  const stamp = (rows, x0, y0, into) => rows.forEach((r, y) => [...r].forEach((c, x) => c === "#" && set(x0 + x, y0 + y, into)));

  folkBorder(W, H).forEach(p => g.add(p));

  // Title: rasterise "questie" in Tiny5 so each font pixel becomes one stitch.
  try {
    const cv = document.createElement("canvas"), F = 80; cv.width = 900; cv.height = 160;
    const cx = cv.getContext("2d", { willReadFrequently: true });
    cx.font = `${F}px "Tiny5", monospace`; cx.textBaseline = "top"; cx.fillText("questie", 10, 10);
    const d = cx.getImageData(0, 0, cv.width, cv.height).data, on = (x, y) => d[(y * cv.width + x) * 4 + 3] > 128;
    let minRun = Infinity, x0 = 1e9, y0 = 1e9, x1 = 0, y1 = 0;
    for (let y = 0; y < cv.height; y++) { let run = 0;
      for (let x = 0; x <= cv.width; x++) {
        if (x < cv.width && on(x, y)) { run++; x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
        else if (run) { minRun = Math.min(minRun, run); run = 0; }
      } }
    const u = minRun;                     // one Tiny5 pixel, in canvas pixels
    const tw_ = Math.round((x1 - x0 + 1) / u), th = Math.round((y1 - y0 + 1) / u);
    const tx = Math.round((W - tw_) / 2), ty = 6;
    for (let j = 0; j < th; j++) for (let i = 0; i < tw_; i++)
      if (on(Math.floor(x0 + (i + 0.5) * u), Math.floor(y0 + (j + 0.5) * u))) set(tx + i, ty + j);
  } catch {}

  const BW = 15, frameHoles = bunnyFrameStitches(Math.round((W - BW) / 2), H - 10);
  const hopCss = bunnyHopCss("bun", ".card");

  // Twinkling sparkles beside the title
  const SPARK = [".#.", "#.#", ".#."];
  [[7, 9], [W - 10, 9]].forEach(([x, y]) => stamp(SPARK, x, y, tw));

  const pad = 2, VW = W + pad * 2, VH = H + pad * 2, gap = 0.12;
  const holes = s => [...s].map(p => { const [x, y] = p.split(",").map(Number);
    return `<rect x="${x + pad + gap}" y="${y + pad + gap}" width="${1 - gap * 2}" height="${1 - gap * 2}"/>`; }).join("");
  return `<svg viewBox="0 0 ${VW} ${VH}" shape-rendering="crispEdges" role="img" aria-label="questie: pink paper card with a hopping pixel bunny cut out">
    <defs>
      <linearGradient id="paperTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb8d8"/><stop offset="1" stop-color="#ffa3cc"/></linearGradient>
      <linearGradient id="paperBot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f293bf"/><stop offset="1" stop-color="#ffaed3"/></linearGradient>
      <style>${hopCss}</style>
      <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="${VW}" height="${VH}">
        <rect width="${VW}" height="${VH}" fill="#fff"/>
        <g fill="#000">${holes(g)}<g class="tw">${holes(tw)}</g>${Object.entries(frameHoles).map(([n, h]) => `<g class="bun-${n}">${holes(h)}</g>`).join("")}</g>
      </mask>
    </defs>
    <g mask="url(#cut)">
      <rect width="${VW}" height="${VH / 2}" fill="url(#paperTop)"/>
      <rect y="${VH / 2}" width="${VW}" height="${VH / 2}" fill="url(#paperBot)"/>
      <rect y="${VH / 2 - 0.12}" width="${VW}" height="0.12" fill="#d97aa8"/>
      <rect y="${VH / 2}" width="${VW}" height="0.1" fill="#ffd1e6"/>
    </g>
  </svg>`;
}

// ---------- rendering ----------
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// Five-square pixel flower (a plus of stitches) used for every sparkle.
const PX_FLOWER = `<svg class="pxflower" viewBox="0 0 3 3" shape-rendering="crispEdges" aria-hidden="true" fill="currentColor">${[[1, 0], [0, 1], [1, 1], [2, 1], [1, 2]].map(([x, y]) => `<rect x="${x + .1}" y="${y + .1}" width=".8" height=".8"/>`).join("")}</svg>`;
const sparkles = (spots) => spots.map(([l, t, s = 30, d = 0]) => `<span class="spark" style="left:${l}%;top:${t}%;font-size:${s}px;animation-delay:${d}s">${PX_FLOWER}</span>`).join("");
const pct = xp => Math.round((xp / XP_PER_LEVEL) * 100);

const screens = {
  home() {
    const left = S.quests.filter(q => !q.done).length;
    return `
      <div class="card">${getFolkCard()}</div>
      <div class="stats"><span>LVL ${S.level}</span><div class="bar"><i style="width:${pct(S.xp)}%"></i></div><span>${S.xp}/${XP_PER_LEVEL} XP</span></div>
      <button class="pill pixel" data-go="list" autofocus>${left ? `${left} quest${left > 1 ? "s" : ""} today` : "all done!"}</button>`;
  },

  list() {
    const next = S.quests.find(q => !q.done);
    const rows = S.quests.map(q => `
      <button class="row ${q.done ? "done" : ""}" data-go="detail" data-id="${q.id}" ${q === next ? "autofocus" : ""}>
        <span class="check">${q.done ? "✓" : ""}</span>
        <span>${sprite(q.icon, 4)}</span>
        <span class="name">${esc(q.name)}</span>
        <span class="xpv">+${q.xp} XP</span>
      </button>`).join("");
    return `
      <h1 style="font-size:32px">✿ today's quests ♡</h1>
      <div class="list">${rows || '<p class="sub">No quests yet. Add one!</p>'}</div>
      <div class="row-actions">
        <button class="pill ghost" data-go="add">+ add errand</button>
      </div>`;
  },

  detail({ id }) {
    const q = S.quests.find(q => q.id === id);
    if (!q) return screens.list();
    return `
      ${sparkles([[14, 30], [84, 26, 26, .4], [80, 62, 20, .9], [12, 70, 22, 1.2]])}
      <div class="bounce">${sprite(q.icon, 10)}</div>
      <p class="big">${esc(q.name)}</p>
      <p class="sub">${esc(q.errand)} · <span class="xp" style="font-size:24px">+${q.xp} XP</span></p>
      <div class="row-actions">
        ${q.done
          ? `<button class="pill ghost" data-undo="${q.id}">undo</button>`
          : `<button class="pill" data-complete="${q.id}" autofocus>Mark complete</button>`}
        <button class="pill ghost" data-remove="${q.id}">remove</button>
      </div>`;
  },

  complete({ id, gained, leveled }) {
    const q = S.quests.find(q => q.id === id) || { name: "Quest", icon: "star" };
    return `
      ${getFolkFrame()}
      ${burst()}
      <p class="xp" style="margin:0">QUEST COMPLETE!</p>
      <div style="display:flex;gap:18px;align-items:center;text-align:left">
        <span class="done-icon">${sprite(q.icon, 4)}</span>
        <div><p class="big" style="font-size:24px">${esc(q.name.toLowerCase())}… done!</p>
        <p class="xp" style="margin:4px 0 0">+${gained} XP</p></div>
      </div>
      ${getHopBunny()}
      <button class="pill" data-next="${leveled ? "levelup" : "after"}" autofocus>${leveled ? "whoa →" : "yay ♡"}</button>`;
  },

  levelup({ from, to }) {
    return `
      ${getFolkFrame()}
      ${burst()}
      <p class="xp" style="font-size:48px;margin:0">LEVEL UP!</p>
      ${getHopBunny()}
      <div class="bar"><i id="lvbar" style="width:100%"></i></div>
      <p class="big" style="font-size:40px">LVL ${from} → LVL ${to}</p>
      <button class="pill" data-next="after" autofocus>continue</button>`;
  },

  achievement() {
    return `
      ${getFolkFrame()}
      ${burst()}
      <h1 class="underline">achievement!</h1>
      <div class="stamp">${getHopBunny()}</div>
      <p class="big">Functioning Adult</p>
      <p class="sub">Completed all daily quests</p>
      <button class="pill" data-go="home" autofocus>♡</button>`;
  },

  add() {
    return `
      <h1 style="font-size:32px">new side quest</h1>
      <p class="sub">What's the errand?</p>
      <input type="text" id="errand" placeholder="e.g. get coffee" autocomplete="off" autofocus>
      <p class="tag" id="preview">&nbsp;</p>
      <div class="row-actions">
        <button class="pill" id="addBtn">Add quest</button>
        <button class="pill ghost" data-go="list">cancel</button>
      </div>`;
  },
};

function burst() {
  return Array.from({ length: 12 }, (_, i) => {
    const a = (i / 12) * Math.PI * 2, r = 170 + (i % 3) * 30;
    return `<span class="burst" style="--dx:${Math.cos(a) * r}px;--dy:${Math.sin(a) * r}px">${i % 2 ? PX_FLOWER : "♡"}</span>`;
  }).join("");
}

function render(state) {
  const name = state?.screen || "home";
  app.innerHTML = `<main class="screen" data-screen="${name}">${screens[name](state || {})}</main>`;
  const f = app.querySelector("[autofocus]") || app.querySelector("button, input");
  f?.focus({ preventScroll: true });
  if (name === "add") wireAdd();
}

// ---------- navigation (Back = history; Meta caps pushState at 5 entries) ----------
// Keep history shallow: home → list → detail. Celebrations replace in place.
// Each entry remembers its depth (d) so we can always unwind back to home.
const PUSH = { list: true, add: true, detail: true };
function go(state, { replace = false } = {}) {
  const cur = history.state || { screen: "home", d: 0 };
  if (PUSH[state.screen] && !replace) { state.d = cur.d + 1; history.pushState(state, ""); }
  else { state.d = cur.d; history.replaceState(state, ""); }
  render(state);
}
addEventListener("popstate", e => render(e.state || { screen: "home", d: 0 }));

function goHome() {
  const d = (history.state || {}).d || 0;
  if (d > 0) history.go(-d); else render({ screen: "home", d: 0 });
}

// ---------- actions ----------
app.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.go === "home") return goHome();
  if (d.go) return go({ screen: d.go, id: d.id });
  if (d.complete) return complete(d.complete);
  if (d.undo) { const q = S.quests.find(q => q.id === d.undo); q.done = false; S.xp = Math.max(0, S.xp - q.xp); save(); return go({ screen: "detail", id: q.id }, { replace: true }); }
  if (d.remove) { S.quests = S.quests.filter(q => q.id !== d.remove); save(); return history.back(); }
  if (d.next === "levelup") return go({ screen: "levelup", ...pending });
  if (d.next === "after") {
    if (S.quests.length && S.quests.every(q => q.done)) {
      if (!S.achievements.includes(S.day)) S.achievements.push(S.day), save();
      return go({ screen: "achievement" });
    }
    return history.back();  // celebration replaced the detail entry, so Back lands on the list
  }
});

let pending = {};
function complete(id) {
  const q = S.quests.find(q => q.id === id); if (!q || q.done) return;
  q.done = true;
  const from = S.level;
  S.xp += q.xp;
  while (S.xp >= XP_PER_LEVEL) { S.xp -= XP_PER_LEVEL; S.level++; }
  save();
  pending = { from, to: S.level };
  go({ screen: "complete", id, gained: q.xp, leveled: S.level > from });
  try { if ("speechSynthesis" in window) speechSynthesis.speak(new SpeechSynthesisUtterance(`Quest complete. Plus ${q.xp} X P.`)); } catch {}
}

function wireAdd() {
  const input = document.getElementById("errand"), prev = document.getElementById("preview");
  // The glasses composer commits text via input/change, not per-key events.
  const upd = () => { prev.textContent = input.value.trim() ? `→ ${toQuest(input.value.trim()).name}` : " "; };
  input.addEventListener("input", upd); input.addEventListener("change", upd);
  const add = () => {
    const v = input.value.trim(); if (!v) return input.focus();
    S.quests.push(toQuest(v)); save(); history.back();
  };
  document.getElementById("addBtn").addEventListener("click", add);
  input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); add(); } });
}

// ---------- desktop fallback for arrow-key focus ----------
// On the glasses, Chromium spatial navigation moves focus for us. In a normal desktop
// browser it doesn't, so if focus hasn't moved after an arrow key, move it ourselves.
addEventListener("keydown", e => {
  const dirs = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
  if (!dirs[e.key] || e.target.tagName === "INPUT") return;
  const before = document.activeElement;
  setTimeout(() => {
    if (document.activeElement !== before) return;
    const [dx, dy] = dirs[e.key];
    const c = r => [r.left + r.width / 2, r.top + r.height / 2];
    const [x0, y0] = c(before.getBoundingClientRect());
    let best = null, bestScore = Infinity;
    app.querySelectorAll("button, input").forEach(el => {
      if (el === before) return;
      const [x, y] = c(el.getBoundingClientRect());
      const along = (x - x0) * dx + (y - y0) * dy;
      if (along <= 4) return;
      const across = Math.abs((x - x0) * dy) + Math.abs((y - y0) * dx);
      const score = along + across * 2;
      if (score < bestScore) bestScore = score, best = el;
    });
    best?.focus(); best?.scrollIntoView({ block: "nearest" });
  }, 0);
});

history.replaceState({ screen: "home", d: 0 }, "");
render({ screen: "home", d: 0 });
</script>
</body>
</html>
